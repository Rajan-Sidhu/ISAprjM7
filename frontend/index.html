<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Fighter — Sign in</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html">Motion Fighter</a>
    </header>
    <main>
      <h1>Sign in</h1>
      <p class="fine">Describe a move, or use the camera. The API turns it into servo angles.</p>
      <section class="panel">
        <div class="tabs" role="tablist">
          <button type="button" id="show-login" role="tab" aria-selected="true" aria-controls="login-form">Sign in</button>
          <button type="button" id="show-register" role="tab" aria-selected="false" aria-controls="register-form">Register</button>
        </div>
        <form id="login-form">
          <label><span>Email</span><input name="email" type="email" autocomplete="username" required value="john@john.com"></label>
          <label><span>Password</span><input name="password" type="password" autocomplete="current-password" required value="123"></label>
          <button class="primary" type="submit">Sign in</button>
        </form>
        <form id="register-form" hidden>
          <label><span>Email</span><input name="email" type="email" autocomplete="username" required></label>
          <label><span>Password</span><input name="password" type="password" autocomplete="new-password" required minlength="3"></label>
          <button class="primary" type="submit">Create account</button>
          <p class="fine">New accounts are regular users.</p>
        </form>
        <p class="alert" id="form-error" role="alert"></p>
        <div class="accounts">
          <div><span>User</span><span>john@john.com / 123</span></div>
          <div><span>Administrator</span><span>admin@admin.com / 111</span></div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
